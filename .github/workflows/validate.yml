on:
  pull_request:
    branches: [main, next]
  # Also run on main and next themselves so a merge that breaks the gates is caught there.
  push:
    branches: [main, next]

permissions:
  contents: read

jobs:
  allowlist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Gate 1: self-edit branches may only touch allowlisted paths.
      - name: Allowlist enforcement
        run: python scripts/check_allowlist.py origin/main...HEAD

      # WS-20 B4: roadmap drift check (docs/plans/ROADMAP_JOINT_WORKING_PLAN.md).
      # Larry approved 2026-10-22: errors fail CI; warnings remain advisory.
      - name: Roadmap drift check (errors fail, warnings advisory)
        run: python scripts/check_roadmap.py

  policy-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Detached-checkout regression tests
        run: python -m unittest discover -s tests/ci -v

  validate:
    # Independent of policy enforcement so failures do not hide test results.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Gate 2: backend still imports.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Larry approved 2026-11-10: CI installs the production lock
      # (requirements-lock.txt), not the loose requirements.txt. The weekly
      # dependency-drift workflow covers the loose list.
      # The lock is generated on macOS. openwakeword's Linux-only tflite-runtime
      # dependency has no Python 3.12 wheels and is never installed in
      # production, so CI installs openwakeword without dependencies; every
      # other pin installs exactly.
      - name: Install backend dependencies
        run: |
          grep -v '^openwakeword==' requirements-lock.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt"
          pip install --no-deps "$(grep '^openwakeword==' requirements-lock.txt)"
      - name: Backend import smoke
        run: python -c "import jarvis, jarvis.config, jarvis.cli, jarvis.runlog"

      # Gate 2a: undefined-name check (ruff F821). --isolated ignores any
      # ruff config. These three files have known undefined names that their
      # owners fix under their own rows; remove each ignore when fixed:
      #   jarvis/bot/pipeline.py (Callable), tests/unit/test_mcp_mail_registry.py
      #   (subprocess), tests/unit/test_phone_remote_service.py (PreparedMedia).
      - name: Undefined-name check (ruff F821)
        run: >-
          ruff check --isolated --select F821
          --per-file-ignores "jarvis/bot/pipeline.py:F821"
          --per-file-ignores "tests/unit/test_mcp_mail_registry.py:F821"
          --per-file-ignores "tests/unit/test_phone_remote_service.py:F821"
          jarvis mcp_servers scripts services sandbox tests

      # Gate 3: unit tests (C2, MORTIMER_MODEL_DISCIPLINE_AND_MAC_SHELL_PLAN.md
      # — blocking now that the suite has been green on main for a while and
      # jarvis/selfedit/service.py's own validate() runs this same command
      # as its own gate 4, so CI and the self-edit loop can't disagree).
      - name: Unit tests
        run: pytest tests/unit -q

      # Gate 3a: integration tests (added 2026-09-24). #84 merged green while
      # breaking nine tests in tests/integration/test_bot_wiring.py, because
      # this workflow ran tests/unit only; #85 fixed them. Tests marked `live`
      # still skip here (tests/conftest.py skips them unless RUN_LIVE=1, and
      # CI has no keys).
      - name: Integration tests
        run: pytest tests/integration -q

      # Gate 3b: sub-agent quality evals (plan Phase 2b).
      - name: Sub-agent evals
        run: pytest tests/evals/sub_agent_evals.py -q

      # Gate 4: latency regression check.
      - name: Latency budget enforcement
        run: python scripts/latency_probe.py --budget tests/fixtures/latency_sample.log

      # Gate 5: frontend still compiles.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Frontend build
        run: |
          cd web
          npm ci
          npm run build

  # WS-35 B1 also implements WS-30's previously unshipped phone-core gate.
  # JarvisKit and MortimerHost require macOS 26 at runtime, not just its SDK.
  # Runner/Xcode inventory checked 2026-11-11:
  # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-Readme.md
  swift-tests:
    name: Swift (${{ matrix.package }})
    runs-on: macos-26-intel
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # A failure in one package must not cancel evidence from the others.
      fail-fast: false
      matrix:
        package:
          - macos/JarvisKit
          - macos/MortimerHost
          - ios/MortimerPhoneCore
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify hosted Swift toolchain
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(sw_vers -productVersion | cut -d. -f1)" -ge 26
          test "$(uname -m)" = x86_64
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.3"
          sw_vers
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Run full package test suite
        run: swift test --package-path "${{ matrix.package }}"
