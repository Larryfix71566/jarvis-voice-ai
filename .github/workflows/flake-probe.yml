# TEMPORARY diagnostic for the CC7a thread scroll flake. Removed before the PR is ready.
on:
  pull_request:
    branches: [next]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-26-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build tests
        run: swift build --build-tests --package-path macos/MortimerHost
      - name: Repeat CC7aThreadAcceptanceTests
        shell: bash
        run: |
          pass=0; fail=0
          for i in $(seq 1 25); do
            if swift test --skip-build --package-path macos/MortimerHost --filter 'CC7aThreadAcceptanceTests' > "run-$i.log" 2>&1; then
              pass=$((pass+1)); echo "iter $i PASS"
            else
              fail=$((fail+1)); echo "iter $i FAIL"
              grep -E "unmet prerequisite|error:|failed \(" "run-$i.log" || true
            fi
            grep -E "put back to the end" "run-$i.log" || true
          done
          echo "PROBE pass=$pass fail=$fail"
