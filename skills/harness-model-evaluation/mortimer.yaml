example_ids: [daily-harness-brief, compare-subscription-models, model-confirmation, unrelated-weather, unrelated-email, generic-daily-brief, generic-daily-brief-today, switch-harness-opus, compare-opus-fable, switch-harness-astra, model-availability, unrelated-switch, unrelated-comparison, unrelated-switch-comparison, unrelated-claude-fable, unrelated-claude-opus-email]
