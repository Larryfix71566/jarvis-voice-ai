process:
  kind: guidance
  nodes:
    - step_id: establish-evidence
      title: Establish mode and dated evidence
      description: Separate documented models, account eligibility, adapter readiness and measured results.
      inputs: [request, known harness baseline, dated sources]
      outputs: [evidence and unknowns]
      tools: []
      success_criteria: [Missing evidence remains unknown.]
      edges: [{to: recommend}]
    - step_id: recommend
      title: Recommend retaining or evaluating a model
      description: Use read-only daily discovery or prepare an explicitly bounded evaluation plan.
      inputs: [evidence and unknowns]
      outputs: [recommendation with uncertainty]
      tools: []
      success_criteria: [A new release is not presented as proven better.]
      edges: [{to: exact-proposal}]
    - step_id: exact-proposal
      title: Explain exact proposal and confirmation
      description: Show tradeoffs and validation gaps; distinguish saved configuration from verified active runtime.
      inputs: [recommendation with uncertainty]
      outputs: [exact proposal or missing evidence report]
      tools: []
      approval: Larry must explicitly confirm the exact proposed model change in Mortimer; the skill cannot confirm it for him.
      success_criteria: [No recommendation automatically changes a model.]
      edges: []
