# expected values are pinned so a detector edit that changes them fails loudly.
# Contains Larry's own conversation text; private repo only.
guard_regex:
  refuse: "\\b(?:I (?:can(?:no|')t|cannot|am unable to|'m unable to|am not able to|'m not able to|don't have (?:a tool|a way|access|the ability|any way)|do not have (?:a tool|a way|access)|have no (?:tool|way))|(?:that's|that is|it's) (?:outside|beyond) (?:what I|my)|isn't something I (?:can|have))"
  handoff: "\\b(?:you(?:'ll| will)? need to (?:run|open|check|edit|drag|kill|create|copy|tell|do|scroll|merge|pull|share)|you'd need to|run (?:this|that|the) (?:curl )?command|run the curl|copy (?:its|the) output|copy it(?:,| and)|say \\\"?read my clipboard|in your terminal|manually)|\\brun `"
  allowed: "isn't something I have a tool for yet"
limitation_regex: "(?:\\bMISSING[- ]TOOL:|\\bI (?:have no|don't have (?:a|any)|do not have (?:a|any))\\b[^.\\n]{0,40}?\\b(?:tool|way|access)\\b|\\bno tool (?:that|to|for)\\b|\\bisn't available to me\\b|\\bI cannot (?:query|run|execute|reach|access)\\b|\\bcan't execute\\b)"
user_triggers:
  voice-do-it-dont-hand-off: {priority: 10, pattern: "\\b(run (?:the|that|this|a) (?:command|curl)|curl|terminal|clipboard|copy|paste|git |commit|push|pull|branch|merge|kill|vault|provision|api keys?|do (?:it|that) (?:for me|yourself)|you do (?:it|that)|i (?:don't|do not) (?:want|wanna) to do it|by myself|manually)\\b"}
  voice-check-before-cant: {priority: 20, pattern: "\\b(can you(?: not)?|could you|are you (?:not )?able|do you have (?:access|a way|the ability)|you (?:should|already) (?:be able|have)|why (?:can't|can you not|won't|couldn't|didn't) you|is there (?:a|any) way|find another way|look it up|see my|my location|where am i|access to)\\b"}
  voice-explain-failure: {priority: 30, pattern: "\\b(why (?:did|didn't|does|doesn't|is|isn't|was|wasn't|won't|can't)|what (?:happened|went wrong|failed|error)|fail(?:ed|ing|ure)?|error|broken|not working|stuck|logs?\\b|investigate|look into|diagnos)"}
  voice-where-am-i: {priority: 15, pattern: "\\b(where am i|where i am|my (?:current )?location|(?:for|get|find) (?:a|my) location|what (?:city|town|state) am i|near me|nearby|around here)\\b"}
  voice-merged-deploy: {priority: 9, pattern: "\\b(merged|rebuil(?:d|t)|bundle(?:\\.sh)?|redeploy(?:ed)?|deployed|is it live|live yet|(?:go|went|gone) live)\\b"}
