# Supervisor routing eval cases. Each case: one user utterance, the agent
# the Supervisor is expected to delegate to (or "self" when it should answer
# directly). Gate: ≥ 90% correct.
#
# Counts: scheduler 6, librarian 6, analyst 6, systems 5, developer 8, self 7
# = 38 total.

cases:
  # ── scheduler ──────────────────────────────────────────────────────────
  - say: "What time is it?"
    expect: scheduler
  - say: "Remind me to call the dentist tomorrow at 9 AM"
    expect: scheduler
  - say: "What day of the week is Christmas this year?"
    expect: scheduler
  - say: "Cancel my dentist reminder"
    expect: scheduler
  - say: "How many days until my trip on March 3rd?"
    expect: scheduler
  - say: "Set a reminder in 20 minutes to check the oven"
    expect: scheduler

  # ── librarian ──────────────────────────────────────────────────────────
  - say: "Remember that Dr. Patel's office is on Main Street"
    expect: librarian
  - say: "What's Dr. Patel's office address?"
    expect: librarian
  - say: "Remember that my wifi password is bluebird42"
    expect: librarian
  - say: "What did I ask you to remember about my wifi?"
    expect: librarian
  - say: "Note that I prefer decaf after 2 PM"
    expect: librarian
  - say: "What coffee do I like in the afternoon?"
    expect: librarian

  # ── analyst ────────────────────────────────────────────────────────────
  - say: "What's the weather in London?"
    expect: analyst
  - say: "Search the web for the latest SpaceX news"
    expect: analyst
  - say: "What's going on with the stock market today?"
    expect: analyst
  - say: "Look up whether the new Dune movie is out yet"
    expect: analyst
  - say: "Will it rain in Paris this weekend?"
    expect: analyst
  - say: "Find me a summary of today's tech news"
    expect: analyst

  # ── systems ────────────────────────────────────────────────────────────
  - say: "How is my computer holding up?"
    expect: systems
  - say: "How much memory am I using?"
    expect: systems
  - say: "Check my battery level"
    expect: systems
  - say: "Is my disk almost full?"
    expect: systems
  - say: "How long has this machine been on?"
    expect: systems

  # ── developer ──────────────────────────────────────────────────────────
  - say: "Build me an expense tracker app"
    expect: developer
  - say: "Create an app that tracks my workouts"
    expect: developer
  - say: "What apps have you built?"
    expect: developer
  - say: "Make a little to-do list web app for me"
    expect: developer
  - say: "Show me the git status of my expense tracker"
    expect: developer
  - say: "Change your interface to use a darker theme"
    expect: developer
  - say: "Add a clock panel to your own UI, and use Claude Opus for it"
    expect: developer
  - say: "How is the interface edit coming along?"
    expect: developer

  # ── self (answer directly, no delegation) ───────────────────────────────
  - say: "Hello Mortimer"
    expect: self
  - say: "How are you doing today?"
    expect: self
  - say: "What's your name?"
    expect: self
  - say: "Tell me a joke"
    expect: self
  - say: "Thanks, that's all"
    expect: self
  - say: "What can you do?"
    expect: self
  - say: "Switch your voice to George"
    expect: self
