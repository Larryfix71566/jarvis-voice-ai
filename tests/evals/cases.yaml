# Routing eval cases (plan Phase 3, step 3.4 — extended from Appendix B).
# Coverage: 5 per single agent except developer (11), 6 none, 4 multi-agent,
# 12 voice UI control (MORTIMER_VOICE_UI_PLAN.md U8, extended by
# MORTIMER_DRAWER_POPOUT_PLAN.md DP6), 2 screen vision, 10 terse-imperative/
# status-ask (MORTIMER_VOICE_MODEL_BENCH_PLAN.md §4, 2026-08-20),
# 3 troubleshooting->developer (2026-08-20), 2 graph views (MORTIMER_GRAPH_LAYER_PLAN.md, 2026-09-04) = 70 total.
# expect: scheduler | librarian | analyst | systems | developer | none | [agent, agent]

# --- scheduler (5) ---
- {input: "what time is it", expect: scheduler}
- {input: "remind me to water the plants in 3 hours", expect: scheduler}
- {input: "what day of the week is August 20th", expect: scheduler}
- {input: "what reminders do I have today", expect: scheduler}
- {input: "wake me up at 6:30 tomorrow morning", expect: scheduler}

# --- librarian (5) ---
# 2026-09-05 — `or_tool` accepts the direct `remember` tool as well as a
# librarian delegation. Both land in the same place: remember calls
# upsert_fact (jarvis/memory.py:652) and mcp_memory reads the same module
# via search_facts, so a fact stored either way is retrievable either way
# — which is why case 8 ("when does my passport expire") passes while
# these two failed. The cases asserted a distinction the storage layer
# does not make, and the prompt draws the line the OTHER way ("call
# remember immediately" on a durable statement), so as written the eval
# penalised the model for obeying an instruction. Doing nothing at all
# still fails: or_tool requires that tool to have actually been called.
- {input: "remember that my passport expires in March", expect: librarian, or_tool: remember}
- {input: "save a note that the project wifi password is blueplanet42", expect: librarian}
- {input: "when does my passport expire", expect: librarian}
- {input: "what did I save about the wifi", expect: librarian}
- {input: "store this: my dentist is Dr. Patel on Main Street", expect: librarian, or_tool: remember}

