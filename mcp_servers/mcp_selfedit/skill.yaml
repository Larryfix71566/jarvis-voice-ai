name: mcp-selfedit
version: 1.0.0
class: privileged
tools:
  - selfedit_start
  - selfedit_status
  - selfedit_validate
  # B2 — a CHECK, not a gate: the four validation gates cannot see the
  # screen, so a visual change stays unverified until a human runs the
  # branch and Mortimer looks at it.
  - selfedit_verify_appearance
  - selfedit_submit
  - selfedit_revert
  - plan_start
  - plan_status
  - plan_choose
  - plan_adopt
requires_env: []
test: python3 -m pytest tests/unit/test_mcp_selfedit_logic.py -q
