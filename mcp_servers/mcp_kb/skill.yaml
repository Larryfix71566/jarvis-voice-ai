# Skill manifest (upgrade plan §3.1)
name: mcp-kb
version: 1.0.0
class: standard
tools: [kb_search, kb_read, kb_neighbors]
# kb_write, kb_delete, kb_flush exist in logic.py but are intentionally
# NOT exposed as MCP tools — see server.py's module docstring. Only the
# read-oriented tools are voice/model-invokable in W1.
# KB_BASE_URL defaults to http://127.0.0.1:8484 in logic.py. Optional
# forwarding preserves overrides without making the default install fail
# the skill validator (gap-closure re-audit, GC1/GC3).
requires_env: []
optional_env: [KB_BASE_URL]
requires_keychain: []
scopes: []
test: "python3 -m pytest tests/unit/test_mcp_kb_logic.py -q"

