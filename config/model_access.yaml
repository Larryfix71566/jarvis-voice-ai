# Workload access policies for Model Use Enhancements.
# Larry 2026-11-23: every workload runs on a subscription route. The paid
# Anthropic/OpenAI/Kimi/DeepSeek APIs are retired (jarvis.provider_access
# refuses them in every mode), so `direct_api` is only for other vendors'
# gateways chosen explicitly, never a default or a fallback.
# Profile names refer to config/model_profiles.yaml; this file does not define
# models. Routes are explicit so subscription exhaustion cannot become a paid
# API fallback by accident.
defaults:
  minimum_quality_tier: mid
  route: subscription
  fallback_routes: []
  capabilities: [text, tools]

# Staged retirement selections. Only used with JARVIS_LLM_ACCESS_MODE set
# to subscription_only; capability/privacy gates are deliberately unchanged.
# Existing explicit/saved paid selections are refused, never rewritten.
subscription_defaults:
  voice_supervisor: {route: subscription}
  scheduler: {route: subscription}
  librarian: {route: subscription}
  analyst: {route: subscription}
  systems: {route: subscription}
  developer: {route: subscription}
  app_builder: {route: subscription}
  memory: {route: subscription}
  memory_shadow: {route: subscription}
  background: {route: subscription}
  council: {route: subscription}
  planning: {route: subscription}
  research_synthesis: {route: subscription}
  vision: {route: subscription}

routes:
  subscription:
    adapter: subscription_runtime
    billing: subscription
    provider: claude
    privacy: approved_external
    # A resolved route carries only what its workload needs (model_routing
    # ._resolved_route), so text workloads use the text adapter and tool
    # workloads the native tool adapter with its capability receipt.
    capabilities: [text, tools]
  codex_subscription:
    adapter: codex_subscription_runtime
    billing: subscription
    provider: codex
    privacy: approved_external
    capabilities: [text]
  saygm:
    adapter: saygm_gateway
    billing: saygm_credit
    credential_env: SAYGM_API_KEY
    base_url: https://api.saygm.com/v1
    privacy: approved_external
    capabilities: [text, tools]
  local:
    adapter: local_runtime
    billing: local
    privacy: local_only

workloads:
  voice_supervisor:
    minimum_quality_tier: economy
    # Larry 2026-11-23: the most capable current Claude that should hold voice
    # latency, on the subscription. Sonnet over Haiku: the 2026-08-20 bench
    # measured Sonnet 4.5 TTFT at parity with Haiku 4.5 (2345 vs 2399 ms) with
    # better routing. Sonnet 5.5 is the current Sonnet (Sonnet 4.5 retires
    # 2026-11-30) and the pinned claude CLI (2.1.290/2.1.291) is reported to
    # know it; Haiku 5.5 and Fable 5.2 would need a CLI bump. The subscription
    # path is not yet latency-measured live; scripts/latency_probe.py --budget
    # on a 15-turn session decides.
    profile: claude-sonnet-5-5
    route: subscription
    privacy: approved_external
    priority: interactive
    fallback_routes: []
  scheduler:
    profile: claude-sonnet-5
    route: subscription
    privacy: approved_external
    priority: interactive
    fallback_routes: []
  librarian:
    profile: claude-sonnet-5
    route: subscription
    privacy: confidential
    priority: interactive
    fallback_routes: []
  analyst:
    profile: claude-sonnet-5
    route: subscription
    privacy: approved_external
    priority: interactive
    fallback_routes: []
  systems:
    profile: claude-sonnet-5
    route: subscription
    privacy: local_only
    priority: interactive
    fallback_routes: []
  developer:
    profile: claude-opus
    route: subscription
    privacy: approved_external
    priority: interactive
    fallback_routes: []
  app_builder:
    profile: claude-opus
    route: subscription
    privacy: approved_external
    priority: interactive
    fallback_routes: []
  memory:
    profile: claude-sonnet-5
    route: subscription
    privacy: confidential
    priority: background
    capabilities: [text]
    fallback_routes: []
  # Public fixtures only. This profile exists to exercise the same classifier
  # adapter on synthetic, approved-external data without weakening live memory.
  memory_shadow:
    profile: claude-sonnet-5
    route: subscription
    privacy: approved_external
    priority: background
    capabilities: [text]
    fallback_routes: []
  background:
    profile: claude-sonnet-5
    route: subscription
    privacy: confidential
    priority: background
    capabilities: [text]
    fallback_routes: []
  council:
    minimum_quality_tier: economy
    profile: claude-sonnet-5
    route: subscription
    privacy: approved_external
    priority: background
    capabilities: [text]
    fallback_routes: []

  planning:
    minimum_quality_tier: frontier
    profile: claude-fable-5
    route: subscription
    privacy: approved_external
    priority: interactive
    capabilities: [text]
    fallback_routes: []
  research_synthesis:
    profile: claude-sonnet-5
    route: subscription
    privacy: approved_external
    priority: interactive
    capabilities: [text]
    fallback_routes: []
  vision:
    profile: claude-opus
    route: subscription
    privacy: approved_external
    priority: interactive
    capabilities: [text, images]
    fallback_routes: []
