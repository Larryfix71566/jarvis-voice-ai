# Sub-agent roster + routing metadata (plan §6.4, Phase 3 — exact schema)
sub_agents:
  # Larry 2026-08-21 — "all of the agents should have screen vision":
  # mcp-screen is now wired to every sub-agent, not just systems and
  # developer. Same guardrails apply everywhere (JARVIS_SCREEN_ENABLED is
  # the one kill switch; capture happens only inside an explicit tool
  # call; the image never persists on success).
  - name: scheduler
    display_name: Scheduler
    mcp_servers: [mcp-time, mcp-reminders, mcp-screen]
    description: "Time, dates, day-of-week and calendar questions in the user's timezone; reminders, alarms, scheduling and planning."
  - name: librarian
    display_name: Librarian
    mcp_servers: [mcp-notes, mcp-memory, mcp-screen]
    description: "Long-term memory: store and recall facts, notes, preferences. Also resolves flagged memory conflicts and cleanup items awaiting review: list them, keep one side, rewrite, dismiss, convert to a workflow, or archive as implemented. Archived facts (merged or aged out by capacity enforcement, never deleted) are still searchable with memory_search — use it before telling the user something is forgotten."
  - name: analyst
    display_name: Analyst
    mcp_servers: [mcp-web, mcp-screen]
    description: "Web research, current events, sports results, weather, the time in other cities, and general lookups."
  - name: systems
    display_name: Systems
    # mcp-screen: visual troubleshooting — see a screen rather than
    # only reading logs (MORTIMER_SHELL_FIX_AND_SCREEN_VISION_PLAN.md V3).
    mcp_servers: [mcp-system, mcp-screen]
    description: "Local machine status: CPU, memory, disk, battery, uptime."
  - name: developer
    display_name: Developer
    # mcp-screen: verify UI/window placement visually while debugging.
    mcp_servers: [mcp-git, mcp-apps, mcp-repo, mcp-selfedit, mcp-runlog, mcp-screen]
    # MORTIMER_DEVELOPER_AGENT_FIX_PLAN.md F3: developer tasks (multi-file
    # review, plan drafting) legitimately exceed the 45s voice-loop
    # default; two live runs timed out doing exactly that. Other agents
    # stay snappy at the default.
    # MORTIMER_PLANNING_PATHWAY_PLAN.md P1 (2026-08-17): 120s was still
    # too short — observed successful spec writes ran 70-95s with little
    # headroom, and two more runs timed out outright (9ed79982, e097fc31).
    # 300s gives real headroom; the hard stop itself stays as the hang
    # recovery path for a stuck provider call (removing it entirely was
    # considered and rejected).
    timeout_s: 300
    # Larry 2026-08-18 — the iteration cap, not the timeout, was the real
    # wall. Two runs (54b62f69, 9f0684e2) read 9-11 files with every tool
    # call SUCCEEDING and still returned "FAILED: the task could not be
    # completed" after 5 rounds; the Supervisor then told Larry "the
    # codebase access is blocked", which was invented. Analysis work needs
    # room to orient before it can answer. Conversational agents stay at
    # the default 5 — this is the one agent that reads its way to an
    # answer.
    #
    # Larry 2026-08-20 — 15 was still too low: 3 of 12 recent runs
    # (b0121fee, a2af4494, 8c0ff7ff — investigate-then-edit tasks, every
    # tool call fine) exhausted 15/15 rounds and returned
    # ITERATIONS_EXHAUSTED. 25 is not arbitrary: measured round cost is
    # 5-11s, so 25 rounds is ~125-275s against the 300s timeout_s above —
    # past ~28 rounds the timeout binds first, and a larger cap would only
    # convert cap-failures into timeout-failures. If runs start dying at
    # 25/25, the next lever is the timeout (or routing the task through
    # selfedit_start, which has its own budget), not this number again.
    max_iterations: 25
    # MORTIMER_MODEL_DISCIPLINE_AND_MAC_SHELL_PLAN.md A1 — the voice
    # model (Haiku) is a dispatcher, never a design/build model. The
    # developer is the one sub-agent that does real implementation work,
    # so it gets a build-grade model from the registry
    # (config/upgrade_models.yaml). Change the profile name here to
    # reassign; resolution failures fall back to the voice model with a
    # logged warning.
    # Larry 2026-08-19 — moved from kimi-k3 (direct Moonshot) to a
    # coding-tuned frontier model reached through OpenRouter (or-codex-max),
    # for the reason he gave: one key buys access to genuinely frontier
    # build models instead of the one mid-tier model a single vendor
    # offered.
    #
    # Larry 2026-08-22 — moved again, or-codex-max -> claude-opus ("I would
    # rather the default developer model be opus 5 not gpt-5.1"), after a
    # live session where the model chip reading "gpt-5.1-codex-max" was
    # itself a source of confusion. claude-opus is a DIRECT Anthropic
    # profile (no proxy hop), which the registry's own guidance prefers for
    # this agent — the developer lives on tool calls, and a known-good
    # direct route beats a proxy that may route the same slug to upstreams
    # of differing tool fidelity. It also rides ANTHROPIC_API_KEY, the same
    # key the voice loop already proves alive at every boot.
    #
    # A dead/missing key would make SubAgent fall back to the VOICE model,
    # which would put a dispatcher on build work; on_profile_fallback:
    # refuse below turns that into a loud refusal instead — and the Agents
    # tab card chip always names the RESOLVED model, so what actually ran
    # is never a guess.
    model_profile: claude-opus
    # K5 (Larry 2026-08-19). Verified that day: this key was read by
    # scripts/check_env.py and by NOTHING in jarvis/ — the preflight warned
    # that a refuse-mode agent would "refuse every delegation" while the
    # agent quietly fell back to the voice model instead. Now implemented
    # in SubAgent, and set here rather than left implicit.
    #
    # `refuse` for the developer specifically: this is the one agent whose
    # assigned model IS the point. A build-grade task silently executed by
    # the voice dispatcher produces plausible-looking work from the wrong
    # model, which is far harder to catch than a refusal — and harder still
    # now that the profile lives behind a proxy key that can lapse
    # independently of everything else. Conversational agents stay on the
    # `warn` default: Haiku is genuinely correct for them, so a fallback
    # costs nothing and voice must still boot on a fresh checkout.
    on_profile_fallback: refuse
    # A3 — a maintained "where things live" map injected into this
    # agent's system prompt at construction, so it stops burning its
    # 5-iteration budget rediscovering its own codebase.
    inject_repo_map: true
    description: "The Jarvis git repository: status, recent commits, diffs, committing and pushing changes (with confirmation), and the audit trail of repository actions. Also reads, searches, and edits files in the local working tree on this machine (previewed and confirmed before anything is written) — separate from GitHub, which is only used to create new app repos and to host pull requests. Also builds new applications: each app gets its own private GitHub repo (created only after user confirmation) and is recorded in the Mortimer app registry. Also self-development: edits to Mortimer's own interface through the self-development loop — preview with the user, plan in the background, validate, and open a pull request only after explicit confirmation; merging always stays with the human on GitHub. Also troubleshooting: investigates why any past task or specialist run failed or found nothing, by reading the run log that records every delegation's tool calls and results."
