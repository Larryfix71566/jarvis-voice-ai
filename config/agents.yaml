# Sub-agent roster + routing metadata (plan §6.4, Phase 3 — exact schema)
sub_agents:
  - name: scheduler
    display_name: Scheduler
    mcp_servers: [mcp-time, mcp-reminders]
    description: "Time, dates, day-of-week and calendar questions in the user's timezone; reminders, alarms, scheduling and planning."
  - name: librarian
    display_name: Librarian
    mcp_servers: [mcp-notes]
    description: "Long-term memory: store and recall facts, notes, preferences."
  - name: analyst
    display_name: Analyst
    mcp_servers: [mcp-web]
    description: "Web research, current events, sports results, weather, the time in other cities, and general lookups."
  - name: systems
    display_name: Systems
    mcp_servers: [mcp-system]
    description: "Local machine status: CPU, memory, disk, battery, uptime."
  - name: developer
    display_name: Developer
    mcp_servers: [mcp-git, mcp-apps, mcp-selfedit]
    description: "The Jarvis git repository: status, recent commits, diffs, committing and pushing changes (with confirmation), and the audit trail of repository actions. Also builds new applications: each app gets its own private GitHub repo (created only after user confirmation) and is recorded in the Mortimer app registry. Also self-development: edits to Mortimer's own interface through the self-development loop — preview with the user, plan in the background, validate, and open a pull request only after explicit confirmation; merging always stays with the human on GitHub."
