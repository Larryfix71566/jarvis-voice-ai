# Sub-agent roster. The Supervisor routes via delegate_task using these
# descriptions; prompts.py stays the single source of truth for the prompts
# themselves — this file is routing metadata + MCP server ownership.
agents:
  - name: scheduler
    display_name: Scheduler
    description: >-
      Time, dates, calendars, and reminders: current time, date math,
      creating/listing/cancelling reminders.
    mcp_servers: [mcp-time, mcp-reminders]
  - name: librarian
    display_name: Librarian
    description: >-
      Persistent memory: notes the user asked Mortimer to remember, recall of
      stored facts, preferences, and prior conversations.
    mcp_servers: [mcp-notes]
  - name: analyst
    display_name: Analyst
    description: >-
      Research and current information: web search, summarizing findings,
      weather lookups.
    mcp_servers: [mcp-web]
  - name: systems
    display_name: Systems
    description: >-
      The machine Mortimer runs on: CPU, memory, disk, battery, uptime and
      other machine-status checks.
    mcp_servers: [mcp-system]
  - name: developer
    display_name: Developer
    description: >-
      Building things: creating new apps as private GitHub repos from
      templates, listing built apps, and repo operations. Also self-
      development: editing Mortimer's own interface through the
      self-development loop — preview with the user, plan in the background,
      validate, and open a pull request only after explicit confirmation;
      merging always stays with the human on GitHub.
    mcp_servers: [mcp-git, mcp-apps, mcp-selfedit]
