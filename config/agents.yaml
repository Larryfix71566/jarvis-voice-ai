# Sub-agent roster + routing metadata (plan §6.4, Phase 3 — exact schema)
sub_agents:
  # Larry 2026-08-21 — "all of the agents should have screen vision":
  # mcp-screen is now wired to every sub-agent, not just systems and
  # developer. Same guardrails apply everywhere (JARVIS_SCREEN_ENABLED is
  # the one kill switch; capture happens only inside an explicit tool
  # call; the image never persists on success).
  - name: scheduler
    display_name: Scheduler
    mcp_servers: [mcp-time, mcp-reminders, mcp-screen]
    # 2026-09-01 — model floor (Larry: "the only agent that can use Haiku is
    # the voice agent; all other agents should not go below the Sonnet or
    # equivalent level"; MORTIMER_OPTIMIZATION_PLAN.md Phase 0b item 5).
    # Supersedes the earlier "Haiku is correct for the conversational
    # agents" stance. `refuse`, not `warn`: warn falls back to the voice
    # model, which IS Haiku — the one outcome the floor forbids. Pinned by
    # tests/unit/test_model_floor.py.
    model_profile: claude-sonnet-5
    on_profile_fallback: refuse
    # 2026-09-02 -- Phase 1b (effort control; MORTIMER_OPTIMIZATION_PLAN.md
    # Phase 1b task 2 starting value). Only takes effect on the native
    # Anthropic path (jarvis/effort.py refuses for any other provider, and
    # for Haiku models regardless of this setting) -- every current profile
    # here resolves to claude-sonnet-5/claude-opus, both Anthropic-direct,
    # so it applies today. Override live, one rung at a time, without
    # touching this file: JARVIS_EFFORT_SCHEDULER=<level>.
    effort: low
    description: "Time, dates, day-of-week and calendar questions in the user's timezone; reminders, alarms, scheduling and planning."
  - name: librarian
    display_name: Librarian
    mcp_servers: [mcp-notes, mcp-memory, mcp-kb, mcp-screen]
    # 2026-09-01 — model floor (Larry: "the only agent that can use Haiku is
    # the voice agent; all other agents should not go below the Sonnet or
    # equivalent level"; MORTIMER_OPTIMIZATION_PLAN.md Phase 0b item 5).
    # Supersedes the earlier "Haiku is correct for the conversational
    # agents" stance. `refuse`, not `warn`: warn falls back to the voice
    # model, which IS Haiku — the one outcome the floor forbids. Pinned by
    # tests/unit/test_model_floor.py.
    model_profile: claude-sonnet-5
    on_profile_fallback: refuse
    # 2026-09-22: 09-18 memory-graph run used 13 tool calls against the default 5.
    max_iterations: 10
    # 2026-09-02 -- Phase 1b (effort control; MORTIMER_OPTIMIZATION_PLAN.md
    # Phase 1b task 2 starting value). Only takes effect on the native
    # Anthropic path (jarvis/effort.py refuses for any other provider, and
    # for Haiku models regardless of this setting) -- every current profile
    # here resolves to claude-sonnet-5/claude-opus, both Anthropic-direct,
    # so it applies today. Override live, one rung at a time, without
    # touching this file: JARVIS_EFFORT_LIBRARIAN=<level>.
    effort: medium
    description: "Long-term memory: store and recall facts, notes, preferences. Also resolves flagged memory conflicts and cleanup items awaiting review: list them, keep one side, rewrite, dismiss, convert to a workflow, or archive as implemented. Archived facts (merged or aged out by capacity enforcement, never deleted) are still searchable with memory_search — use it before telling the user something is forgotten. Also searches a separate knowledge base of longer curated project documents and session digests (kb_search/kb_read/kb_neighbors) — distinct from the keyed facts above; use this when the user asks about something more like a document, decision record, or past session's details rather than a short preference or fact. Also draws a picture of how memories relate around a topic (memory_graph_view)."
  - name: analyst
    display_name: Analyst
    mcp_servers: [mcp-web, mcp-screen]
    # Larry 2026-08-25 — measured, not guessed: six analyst runs died on
    # ITERATIONS_EXHAUSTED the same evening (462da350, 97d5cecc, 9bd877dc,
    # d125f5a3, fd13d883, 06e6ad89), all at the base default (5 rounds,
    # 45s). Analyst had been left on the conversational default alongside
    # scheduler/librarian/systems, but it does real multi-query research
    # now — a single-site profile or a benchmark search legitimately needs
    # more than 5 rounds of web_search. Observed round cost in those
    # failures was ~1.2-5.3s (network-bound); 15 rounds at the slow end is
    # ~80s, so timeout_s rises with it to 120s — raising the cap alone
    # would just convert an iteration failure into a timeout failure. Note
    # this does NOT cover deep multi-site content comparison (two of the
    # six failures were that shape) — that's what research_compare_start
    # exists for; a bigger budget here would make the wrong tool slightly
    # less wrong rather than fixing the routing.
    timeout_s: 120
    max_iterations: 15
    # 2026-09-01 — model floor (Larry: "the only agent that can use Haiku is
    # the voice agent; all other agents should not go below the Sonnet or
    # equivalent level"; MORTIMER_OPTIMIZATION_PLAN.md Phase 0b item 5).
    # Supersedes the earlier "Haiku is correct for the conversational
    # agents" stance. `refuse`, not `warn`: warn falls back to the voice
    # model, which IS Haiku — the one outcome the floor forbids. Pinned by
    # tests/unit/test_model_floor.py.
    model_profile: claude-sonnet-5
    on_profile_fallback: refuse
    # 2026-09-02 -- Phase 1b (effort control; MORTIMER_OPTIMIZATION_PLAN.md
    # Phase 1b task 2 starting value). Only takes effect on the native
    # Anthropic path (jarvis/effort.py refuses for any other provider, and
    # for Haiku models regardless of this setting) -- every current profile
    # here resolves to claude-sonnet-5/claude-opus, both Anthropic-direct,
    # so it applies today. Override live, one rung at a time, without
    # touching this file: JARVIS_EFFORT_ANALYST=<level>.
    effort: medium
    description: "Web research, current events, sports results, weather, the time in other cities, and general lookups."
  - name: systems
    display_name: Systems
    # mcp-screen: visual troubleshooting — see a screen rather than
    # only reading logs (MORTIMER_SHELL_FIX_AND_SCREEN_VISION_PLAN.md V3).
    # mcp-status: Mortimer's own live status (status spec T2.6).
    mcp_servers: [mcp-system, mcp-screen, mcp-status]
    # 2026-09-01 — model floor (Larry: "the only agent that can use Haiku is
    # the voice agent; all other agents should not go below the Sonnet or
    # equivalent level"; MORTIMER_OPTIMIZATION_PLAN.md Phase 0b item 5).
    # Supersedes the earlier "Haiku is correct for the conversational
    # agents" stance. `refuse`, not `warn`: warn falls back to the voice
    # model, which IS Haiku — the one outcome the floor forbids. Pinned by
    # tests/unit/test_model_floor.py.
    model_profile: claude-sonnet-5
    on_profile_fallback: refuse
    # 2026-09-02 -- Phase 1b (effort control; MORTIMER_OPTIMIZATION_PLAN.md
    # Phase 1b task 2 starting value). Only takes effect on the native
    # Anthropic path (jarvis/effort.py refuses for any other provider, and
    # for Haiku models regardless of this setting) -- every current profile
    # here resolves to claude-sonnet-5/claude-opus, both Anthropic-direct,
    # so it applies today. Override live, one rung at a time, without
    # touching this file: JARVIS_EFFORT_SYSTEMS=<level>.
    effort: low
    description: "Local machine status: CPU, memory, disk, battery, uptime. Also reads Mortimer's own live status: models and key health, provider model catalogs, subscription checks, services, configuration, app build, open pull requests and their checks, and logs (status_*, github_prs, log_search)."
  - name: developer
    display_name: Developer
    # mcp-screen: verify UI/window placement visually while debugging.
    # mcp-status: Mortimer's own live status and log search (status spec T2.6).
    mcp_servers: [mcp-git, mcp-repo, mcp-selfedit, mcp-runlog, mcp-screen, mcp-status]
    # MORTIMER_DEVELOPER_AGENT_FIX_PLAN.md F3: developer tasks (multi-file
    # review, plan drafting) legitimately exceed the 45s voice-loop
    # default; two live runs timed out doing exactly that. Other agents
    # stay snappy at the default.
    # MORTIMER_PLANNING_PATHWAY_PLAN.md P1 (2026-08-17): 120s was still
    # too short — observed successful spec writes ran 70-95s with little
    # headroom, and two more runs timed out outright (9ed79982, e097fc31).
    # 300s gives real headroom; the hard stop itself stays as the hang
    # recovery path for a stuck provider call (removing it entirely was
    # considered and rejected).
    timeout_s: 300
    # Larry 2026-08-18 — the iteration cap, not the timeout, was the real
    # wall. Two runs (54b62f69, 9f0684e2) read 9-11 files with every tool
    # call SUCCEEDING and still returned "FAILED: the task could not be
    # completed" after 5 rounds; the Supervisor then told Larry "the
    # codebase access is blocked", which was invented. Analysis work needs
    # room to orient before it can answer. Conversational agents stay at
    # the default 5 — this is the one agent that reads its way to an
    # answer.
    #
    # Larry 2026-08-20 — 15 was still too low: 3 of 12 recent runs
    # (b0121fee, a2af4494, 8c0ff7ff — investigate-then-edit tasks, every
    # tool call fine) exhausted 15/15 rounds and returned
    # ITERATIONS_EXHAUSTED. 25 is not arbitrary: measured round cost is
    # 5-11s, so 25 rounds is ~125-275s against the 300s timeout_s above —
    # past ~28 rounds the timeout binds first, and a larger cap would only
    # convert cap-failures into timeout-failures. If runs start dying at
    # 25/25, the next lever is the timeout (or routing the task through
    # selfedit_start, which has its own budget), not this number again.
    max_iterations: 25
    # MORTIMER_MODEL_DISCIPLINE_AND_MAC_SHELL_PLAN.md A1 — the voice
    # model (Haiku) is a dispatcher, never a design/build model. The
    # developer is the one sub-agent that does real implementation work,
    # so it gets a build-grade model from the registry
    # (config/upgrade_models.yaml). Change the profile name here to
    # reassign; resolution failures fall back to the voice model with a
    # logged warning.
    # Larry 2026-08-19 — moved from kimi-k3 (direct Moonshot) to a
    # coding-tuned frontier model reached through OpenRouter (or-codex-max),
    # for the reason he gave: one key buys access to genuinely frontier
    # build models instead of the one mid-tier model a single vendor
    # offered.
    #
    # Larry 2026-08-22 — moved again, or-codex-max -> claude-opus ("I would
    # rather the default developer model be opus 5 not gpt-5.1"), after a
    # live session where the model chip reading "gpt-5.1-codex-max" was
    # itself a source of confusion. claude-opus is a DIRECT Anthropic
    # profile (no proxy hop), which the registry's own guidance prefers for
    # this agent — the developer lives on tool calls, and a known-good
    # direct route beats a proxy that may route the same slug to upstreams
    # of differing tool fidelity. It also rides ANTHROPIC_API_KEY, the same
    # key the voice loop already proves alive at every boot.
    #
    # A dead/missing key would make SubAgent fall back to the VOICE model,
    # which would put a dispatcher on build work; on_profile_fallback:
    # refuse below turns that into a loud refusal instead — and the Agents
    # tab card chip always names the RESOLVED model, so what actually ran
    # is never a guess.
    model_profile: claude-opus
    # K5 (Larry 2026-08-19). Verified that day: this key was read by
    # scripts/check_env.py and by NOTHING in jarvis/ — the preflight warned
    # that a refuse-mode agent would "refuse every delegation" while the
    # agent quietly fell back to the voice model instead. Now implemented
    # in SubAgent, and set here rather than left implicit.
    #
    # `refuse` for the developer specifically: this is the one agent whose
    # assigned model IS the point. A build-grade task silently executed by
    # the voice dispatcher produces plausible-looking work from the wrong
    # model, which is far harder to catch than a refusal — and harder still
    # now that the profile lives behind a proxy key that can lapse
    # independently of everything else. Conversational agents stay on the
    # `warn` default: Haiku is genuinely correct for them, so a fallback
    # costs nothing and voice must still boot on a fresh checkout.
    on_profile_fallback: refuse
    # A3 — a maintained "where things live" map injected into this
    # agent's system prompt at construction, so it stops burning its
    # 5-iteration budget rediscovering its own codebase.
    inject_repo_map: true
    description: "The Jarvis git repository: status, recent commits, diffs, committing and pushing changes (with confirmation), and the audit trail of repository actions. Also reads, searches, and edits files in the local working tree on this machine (previewed and confirmed before anything is written) — separate from GitHub, which is only used to create new app repos and to host pull requests. Building a NEW application is the app_builder specialist and not this one; this specialist owns the Jarvis repository itself and Mortimer's own interface. Its git tools act on one working tree, so commit and push never need a repository named and asking which one is never the missing information. Also self-development: edits to Mortimer's own interface through the self-development loop — preview with the user, plan in the background, validate, and open a pull request only after explicit confirmation; merging always stays with the human on GitHub. Also troubleshooting: investigates why any past task or specialist run failed or found nothing, by reading the run log that records every delegation's tool calls and results. Also the council rounds behind plans and self-edits, and draws a relationship graph of runs, tools, models, and council rounds on request (graph_view). Also reads Mortimer's own live status: models and key health, provider model catalogs, subscription checks, services, configuration, app build, open pull requests and their checks, and logs (status_*, github_prs, log_search)."

  # 2026-09-06 — split out of `developer`. Two reasons, both measured:
  # developer carried SIX mcp servers and ~31 tools against 2-4 for every
  # other specialist, and it is the only category that has ever missed in
  # the routing eval (22 cases; 15/22, then 17/22, then 20/22, while every
  # other category has been 100% in all three runs). Case 56 ("commit
  # that") missed 3/3 by asking WHICH repository — a fair question while
  # one description covered both the Jarvis working tree and per-app
  # GitHub repos.
  #
  # The seam is clean: mcp-apps is pure GitHub API and needs nothing from
  # mcp-git, while self-development genuinely does (a self-edit ends in a
  # commit and a PR). Nothing is shared, so nothing had to be torn.
  #
  # NAME USES AN UNDERSCORE, not a hyphen: tests/unit/
  # test_agents_yaml_frontend_parity.py matches frontend keys with
  # [a-z_]+, so a hyphenated name would never match the layout entry and
  # the guard would fail even once the satellite was added.
  - name: app_builder
    display_name: App Builder
    mcp_servers: [mcp-apps, mcp-screen]
    # Mirrors developer exactly (Larry, 2026-09-06): this was developer's
    # work an hour ago, so the split changes routing, not capability.
    model_profile: claude-opus
    on_profile_fallback: refuse
    description: "Builds and maintains NEW applications, each in its own private GitHub repository: creates the repo (only after user confirmation), writes and reads its files, registers it in the Mortimer app registry, lists what has been built, and starts, checks and submits its builds. All of it goes through the GitHub API — an app repo is never checked out and never committed to locally, so this specialist has no commit or push tool at all. This is NOT self-development: changing Mortimer's own interface, and anything inside the Jarvis repository, is the developer specialist."
