# MCP skill servers spawned by the SkillRegistry.
# command/args are resolved from the repo root.
servers:
  - name: mcp-time
    command: python
    args: ["-m", "mcp_servers.mcp_time.server"]
    env: {}
  - name: mcp-notes
    command: python
    args: ["-m", "mcp_servers.mcp_notes.server"]
    env: {}
  - name: mcp-reminders
    command: python
    args: ["-m", "mcp_servers.mcp_reminders.server"]
    env: {}
  - name: mcp-web
    command: python
    args: ["-m", "mcp_servers.mcp_web.server"]
    env: {}
  - name: mcp-system
    command: python
    args: ["-m", "mcp_servers.mcp_system.server"]
    env: {}
  - name: mcp-apps
    command: python
    args: ["-m", "mcp_servers.mcp_apps.server"]
    env: {}
  - name: mcp-selfedit
    command: python
    args: ["-m", "mcp_servers.mcp_selfedit.server"]
    env: {}
