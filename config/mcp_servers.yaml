servers:
  - name: mcp-time
    command: python
    args: ["-m", "mcp_servers.mcp_time.server"]
    env: {}
  - name: mcp-notes
    command: python
    args: ["-m", "mcp_servers.mcp_notes.server"]
    env:
      JARVIS_DB_PATH: "${JARVIS_DB_PATH}"
  # Larry 2026-08-21 — voice control of the Memory panel's review queue
  # (librarian only; see config/agents.yaml).
  - name: mcp-memory
    command: python
    args: ["-m", "mcp_servers.mcp_memory.server"]
    env:
      JARVIS_DB_PATH: "${JARVIS_DB_PATH}"
  - name: mcp-reminders
    command: python
    args: ["-m", "mcp_servers.mcp_reminders.server"]
    env:
      JARVIS_DB_PATH: "${JARVIS_DB_PATH}"
      JARVIS_TIMEZONE: "${JARVIS_TIMEZONE}"
  - name: mcp-web
    command: python
    args: ["-m", "mcp_servers.mcp_web.server"]
    env:
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
  - name: mcp-system
    command: python
    args: ["-m", "mcp_servers.mcp_system.server"]
    env: {}
  - name: mcp-git
    command: python
    args: ["-m", "mcp_servers.mcp_git.server"]
    env:
      JARVIS_DB_PATH: "${JARVIS_DB_PATH}"
  - name: mcp-apps
    command: python
    args: ["-m", "mcp_servers.mcp_apps.server"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_OWNER: "${GITHUB_OWNER}"
  - name: mcp-repo
    command: python
    args: ["-m", "mcp_servers.mcp_repo.server"]
    # No env entry (MORTIMER_DEVELOPER_AGENT_FIX_PLAN.md F2): the child
    # inherits the full parent environment, so an exported
    # JARVIS_REPO_ROOT still reaches it. The previous
    # `JARVIS_REPO_ROOT: "${JARVIS_REPO_ROOT}"` line handed the server a
    # LITERAL "${JARVIS_REPO_ROOT}" when the variable was unset
    # (expand_env_vars leaves unknown vars as-is by design), making every
    # repo_read_file report "does not exist" against a phantom root.
    env: {}
  - name: mcp-runlog
    command: python
    args: ["-m", "mcp_servers.mcp_runlog.server"]
    # No env entry, same rule as mcp-repo above: the child inherits the
    # full parent environment, and JARVIS_DB_PATH (if set) reaches it
    # that way — this server is read-only, so no other env is needed.
    env: {}
  - name: mcp-selfedit
    command: python
    args: ["-m", "mcp_servers.mcp_selfedit.server"]
    env: {}
  - name: mcp-screen
    command: python
    args: ["-m", "mcp_servers.mcp_screen.server"]
    # No env entry, same rule as mcp-repo/mcp-runlog above: the child
    # inherits the full parent environment, so JARVIS_SCREEN_ENABLED and
    # JARVIS_VISION_PROFILE (plus whichever vision profile's API key)
    # reach it without an explicit allowlist here — and an explicit list
    # would be actively wrong, since which key is needed depends on
    # which profile config/upgrade_models.yaml resolves to.
    env: {}
