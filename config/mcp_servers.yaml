servers:
  - name: mcp-time
    command: python
    args: ["-m", "mcp_servers.mcp_time.server"]
    env: {}
  - name: mcp-notes
    command: python
    args: ["-m", "mcp_servers.mcp_notes.server"]
    env:
      JARVIS_DB_PATH: "${JARVIS_DB_PATH}"
  # Larry 2026-08-21 — voice control of the Memory panel's review queue
  # (librarian only; see config/agents.yaml).
  - name: mcp-memory
    command: python
    args: ["-m", "mcp_servers.mcp_memory.server"]
    env:
      JARVIS_DB_PATH: "${JARVIS_DB_PATH}"
  - name: mcp-kb
    command: python
    args: ["-m", "mcp_servers.mcp_kb.server"]
    env: {}
    # KB_BASE_URL has a code-level default (http://127.0.0.1:8484); no env
    # entry needed here. skill.yaml's optional_env: [KB_BASE_URL] allowlists
    # it for pass-through if a real override is ever set.
  - name: mcp-reminders
    command: python
    args: ["-m", "mcp_servers.mcp_reminders.server"]
    env:
      JARVIS_DB_PATH: "${JARVIS_DB_PATH}"
      JARVIS_TIMEZONE: "${JARVIS_TIMEZONE}"
  - name: mcp-web
    command: python
    args: ["-m", "mcp_servers.mcp_web.server"]
    env:
      TAVILY_API_KEY: "${TAVILY_API_KEY}"
  - name: mcp-system
    command: python
    args: ["-m", "mcp_servers.mcp_system.server"]
    env: {}
  - name: mcp-git
    command: python
    args: ["-m", "mcp_servers.mcp_git.server"]
    env:
      JARVIS_DB_PATH: "${JARVIS_DB_PATH}"
  - name: mcp-apps
    command: python
    args: ["-m", "mcp_servers.mcp_apps.server"]
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      GITHUB_OWNER: "${GITHUB_OWNER}"
  - name: mcp-repo
    command: python
    args: ["-m", "mcp_servers.mcp_repo.server"]
    # No env entry (MORTIMER_DEVELOPER_AGENT_FIX_PLAN.md F2): the child's
    # environment is built by SkillRegistry from BASE_ENV_KEYS + this
    # server's skill.yaml env declarations (MORTIMER_SECURITY_HARDENING_PLAN.md
    # K2); no env: entry is needed here — mcp-repo's skill.yaml declares
    # JARVIS_REPO_ROOT, so it still reaches the child. The previous
    # `JARVIS_REPO_ROOT: "${JARVIS_REPO_ROOT}"` line handed the server a
    # LITERAL "${JARVIS_REPO_ROOT}" when the variable was unset
    # (expand_env_vars leaves unknown vars as-is by design), making every
    # repo_read_file report "does not exist" against a phantom root.
    env: {}
  - name: mcp-runlog
    command: python
    args: ["-m", "mcp_servers.mcp_runlog.server"]
    # No env entry, same rule as mcp-repo above: the child's environment
    # is built by SkillRegistry from BASE_ENV_KEYS + this server's
    # skill.yaml requires_env (MORTIMER_SECURITY_HARDENING_PLAN.md K2); no
    # env: entry is needed here — JARVIS_DB_PATH is in BASE_ENV_KEYS, so it
    # still reaches the child that way — this server is read-only, so no
    # other env is needed.
    env: {}
  - name: mcp-selfedit
    command: python
    args: ["-m", "mcp_servers.mcp_selfedit.server"]
    env: {}
  - name: mcp-screen
    command: python
    args: ["-m", "mcp_servers.mcp_screen.server"]
    # No env entry, same rule as mcp-repo/mcp-runlog above: the child's
    # environment is built by SkillRegistry from BASE_ENV_KEYS + this
    # server's skill.yaml env declarations (MORTIMER_SECURITY_HARDENING_PLAN.md
    # K2); no env: entry is needed here — mcp-screen's skill.yaml declares
    # JARVIS_SCREEN_ENABLED and JARVIS_VISION_PROFILE, and its
    # requires_env_dynamic resolves the vision profile's API key by name at
    # spawn time, so all three still reach the child without a static
    # allowlist here — a static list would be actively wrong, since which
    # key is needed depends on which profile config/upgrade_models.yaml
    # resolves to.
    env: {}
  # Status spec T2.6 (L2/L8): Mortimer's own live status for the systems
  # and developer agents. A thin HTTP client of the admin sidecar's
  # /api/status/* routes; JARVIS_ADMIN_URL is in BASE_ENV_KEYS, and no
  # secret ever reaches this child.
  - name: mcp-status
    command: python
    args: ["-m", "mcp_servers.mcp_status.server"]
    env: {}
