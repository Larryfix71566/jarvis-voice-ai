# config/model_prices.yaml — versioned price map for computed native costs.
#
# Keyed as "{provider}/{model}" — built by usage_ledger.compute_cost, not
# by you. provider comes from provider_from_base_url() (base.py/settings
# sites) or profile["provider"] (council/model_profile sites); model is
# whatever wire string was actually sent to chat.completions.create.
# This is deliberately NOT the same as model_profiles.yaml's `identity`
# string for every row — it's constructed fresh so every rung's key is
# derivable the same way regardless of which file the call came from.
#
# RATES FILLED 2026-09-01 from vendor pricing pages (see per-entry source
# notes below). Larry 2026-11-23: the Anthropic/OpenAI/Moonshot/DeepSeek
# pay-per-token APIs are retired, so the Moonshot and DeepSeek rows and the
# OpenRouter rows of retired profiles are gone; the Anthropic rows stay only
# as notional list prices for subscription-route usage. OpenRouter rates are
# each model's own OpenRouter pricing page; a few of those (flagged inline) are blended
# across-provider averages with an active promo folded in rather than a
# single canonical list price — fine for now since computed_cost is only
# the fallback for OpenRouter rows until reported_cost lands from the
# puller (see the OpenRouter section below), but re-check before trusting
# these for anything precise.
#
# cache_write_mult / cache_read_mult are multipliers on the INPUT rate.
# Anthropic confirmed (per-model pricing table): 1.25 write (5-min TTL;
# 2.0 for 1h TTL), 0.10 read — uniform across Haiku/Opus/Fable, so kept as
# the default here rather than a special case. Whether these multipliers
# even apply through the OpenAI-compatible endpoint this repo uses is
# STILL UNVERIFIED (see usage_ledger.py's adapter note) — filling the rate
# here answers "what would this cost if caching were active", not "is
# caching active today". Non-Anthropic providers mostly don't publish a
# cache write premium — set to 1.0 unless a source explicitly says otherwise.

version: "2026-09-01"

models:
  # ---- Claude subscription route: notional list prices ----
  # scheduler, librarian, analyst, systems, supervisor, memory_merge,
  # memory_classify, memory_extraction, kb_digest, procedures_describe
  # Source: platform.claude.com/docs/en/about-claude/pricing, 2026-09-01.
  anthropic/claude-haiku-4-5:
    input_per_m: 1.0
    output_per_m: 5.0
    cache_write_mult: 1.25
    cache_read_mult: 0.10
    history: []

  # ---- developer rung (base.py, model_profile: claude-opus) ----
  # Source: platform.claude.com/docs/en/about-claude/pricing, 2026-09-01.
  anthropic/claude-opus-5:
    input_per_m: 5.0
    output_per_m: 25.0
    cache_write_mult: 1.25
    cache_read_mult: 0.10
    history: []

  # ---- present in model_profiles.yaml (Mythos-class); not currently
  # assigned to any rung in agents.yaml, but a profile exists ----
  # Source: platform.claude.com/docs/en/about-claude/pricing, 2026-09-01.
  # Note: this is Claude Fable 5 (not 5.1) — the 5.1 line gets a special
  # 0.025x cache-hit multiplier per that same table; 5 does not, its
  # cache read is the standard 0.10x, so no special-case needed here.
  anthropic/claude-fable-5:
    input_per_m: 10.0
    output_per_m: 50.0
    cache_write_mult: 1.25
    cache_read_mult: 0.10
    history: []

  # ---- Claude subscription route, model-floor tier (agents.yaml
  # model_profile: claude-sonnet-5). Notional list price. Source:
  # platform.claude.com/docs/en/about-claude/pricing, 2026-09-01.
  anthropic/claude-sonnet-5:
    input_per_m: 2.0
    output_per_m: 10.0
    cache_write_mult: 1.25
    cache_read_mult: 0.10
    history: []

  # Voice Supervisor (Larry 2026-11-23), Claude subscription route. Notional
  # list price: $2/$10 per MTok, cache reads $0.10 (Anthropic model table,
  # cached 2026-11-03).
  anthropic/claude-sonnet-5-5:
    input_per_m: 2.0
    output_per_m: 10.0
    cache_write_mult: 1.25
    cache_read_mult: 0.05
    history: []

  # Listed page price; OpenRouter noted an active 50% promo on top of this
  # at fetch time — that discount is not baked in here since promos
  # expire. Re-check if computed_cost looks off for this rung.
  openrouter/google/gemini-3.7-flash:
    input_per_m: 0.75
    output_per_m: 3.75
    cache_write_mult: 1.0
    cache_read_mult: 0.10
    history: []

  openrouter/x-ai/grok-4.3:
    input_per_m: 1.25
    output_per_m: 2.50
    cache_write_mult: 1.0
    cache_read_mult: 0.16
    history: []

  openrouter/x-ai/grok-4.6:
    input_per_m: 2.0
    output_per_m: 6.0
    cache_write_mult: 1.0
    cache_read_mult: 0.25
    history: []

  # ---- voice transport (MORTIMER_SESSION_MISSES_PLAN.md S4/S5) ----
  # Priced per natural unit; usage_ledger.compute_cost converts. These rows
  # carry quantity/unit and zero tokens (rungs tts / stt). The model
  # strings are the literals jarvis/bot/pipeline.py passes to the TTS and
  # STT services.
  #
  # ElevenLabs bills CREDITS; eleven_flash_v2_5 costs 0.5 credit per
  # character (elevenlabs.io/pricing, texttolab.com/blog/elevenlabs-pricing,
  # 2026-09-03), so USD per 1K CHARACTERS is half the plan's USD per 1K
  # credits. Base rates by tier, per 1K chars: Starter 0.085, Creator 0.11,
  # Pro 0.10, Scale/Business 0.085. Overage per 1K chars: Creator 0.15,
  # Pro 0.12, Scale 0.09, Business 0.06. SET FROM YOUR TIER (plan §8 step
  # 1: GET /v1/user/subscription reports it); shipped at Pro base.
  elevenlabs/eleven_flash_v2_5:
    unit: chars
    usd_per_1k_chars: 0.10
    history: []

  # Deepgram Flux streaming, pay-as-you-go list (deepgram.com/pricing,
  # 2026-09-03): $0.0077/min regular; a $0.0065/min promotion was showing
  # that day. Growth tier $0.0065 regular. Shipped at the regular PAYG rate.
  deepgram/flux-general-en:
    unit: seconds
    usd_per_minute: 0.0077
    history: []
