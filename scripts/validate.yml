# CI validation workflow (plan section 2.2).
#
# GitHub does not allow API clients without the `workflow` OAuth scope to
# create files under .github/workflows/, so this file ships here instead.
# ONE-TIME MANUAL STEP: move it into place —
#
#     mkdir -p .github/workflows && mv scripts/validate.yml .github/workflows/
#
# then commit and push. After that, mark the `validate` check as required in
# the branch protection rule for main (plan section 2.1).

name: validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gate 1: self-edit branches may only touch allowlisted paths.
      - name: Allowlist enforcement
        run: python scripts/check_allowlist.py origin/main...HEAD

      # Gate 2: backend still imports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Backend import smoke
        run: python -c "import jarvis, jarvis.config, jarvis.cli"

      # Gate 3: unit tests (non-blocking until the suite is green on main).
      - name: Unit tests
        continue-on-error: true
        run: pytest tests/unit -q

      # Gate 4: frontend still compiles.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend build
        run: |
          cd web
          npm ci
          npm run build
